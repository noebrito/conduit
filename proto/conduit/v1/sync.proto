syntax = "proto3";
package conduit.v1;

option go_package = "github.com/noebrito/conduit/proto/conduit/v1;conduitv1";

message Envelope {
  string schema_version = 1;              // "v1"
  string batch_id = 2;                    // UUID, dedupe key for whole batch
  string device_id = 3;                   // Keychain-stable per-install UUID
  int64  sent_at_unix_ms = 4;
  repeated SampleBatch batches = 5;       // grouped by data type
}

message SampleBatch {
  string hk_type_id = 1;                  // e.g. "HKQuantityTypeIdentifierHeartRate"
  repeated Sample samples = 2;
  // UUIDs of samples HealthKit reported as DELETED for this hk_type_id since the
  // last read (from HKAnchoredObjectQuery's deletedObjects). The ingester emits a
  // bulk `delete` per uuid to the stream this hk_type_id routes to, so an edited/
  // removed food (LoseIt delete+recreate) doesn't leave a ghost doc that inflates
  // nutrition totals. Additive/back-compat: an old ingester ignores it
  // (DiscardUnknown) and an old client never sets it, so the field is empty for
  // upsert-only batches and the wire stays byte-identical when there are no
  // deletions.
  repeated string deleted_uuids = 3;
}

message Sample {
  string uuid = 1;                        // HealthKit sample UUID — dedupe key
  int64  start_unix_ms = 2;
  int64  end_unix_ms = 3;
  Source source = 4;

  oneof value {
    QuantityValue    quantity    = 10;
    CategoryValue    category    = 11;
    WorkoutValue     workout     = 12;
    CorrelationValue correlation = 13;
    RouteValue       route       = 14;
  }
}

message Source {
  string name = 1;
  string bundle_id = 2;
  string product_type = 3;                // e.g. "Watch6,1"
}

message QuantityValue {
  double value = 1;
  string unit = 2;                        // e.g. "count/min", "kg", "m"
}

message CategoryValue {
  int32 value = 1;                        // raw HK enum int
  string value_name = 2;                  // human-readable, e.g. "asleepREM"
}

message WorkoutValue {
  string activity_type = 1;
  double duration_seconds = 2;
  double total_energy_kcal = 3;
  double total_distance_m = 4;
}

message CorrelationValue {
  repeated Sample components = 1;         // e.g. blood pressure = [systolic, diastolic]
}

// A workout's GPS route: a foreign key to its workout plus an ordered series of
// location points. One RouteValue == one HKWorkoutRoute == one document, so the
// whole route dedupes atomically under the enclosing Sample.uuid.
message RouteValue {
  string workout_uuid = 1;                // FK: the Workout sample.uuid this route belongs to
  string activity_type = 2;               // denormalized (e.g. "walking") for filtering/labels
  repeated RoutePoint points = 3;         // ordered oldest -> newest; may be downsampled on-device
}

// One CLLocation, flattened to primitives. Units are canonical/SI on the wire
// (metres, m/s, degrees, unix-ms); clients convert for display.
message RoutePoint {
  double lat = 1;                         // CLLocation.coordinate.latitude
  double lng = 2;                         // CLLocation.coordinate.longitude
  double altitude_m = 3;                  // CLLocation.altitude (ellipsoidal metres)
  int64  timestamp_unix_ms = 4;           // CLLocation.timestamp
  double horizontal_accuracy_m = 5;       // CLLocation.horizontalAccuracy (metres)
  double vertical_accuracy_m = 6;         // CLLocation.verticalAccuracy (metres, <0 = invalid)
  double speed_mps = 7;                   // CLLocation.speed (m/s, <0 = invalid)
  double course_deg = 8;                  // CLLocation.course (degrees, <0 = invalid)
}
